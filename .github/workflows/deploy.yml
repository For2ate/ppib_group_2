name: Deploy Infrastructure (Granular)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      ansible_tags:
        description: 'Specific Tags (optional)'
        required: false
        default: 'all'
        type: string
      deploy_base:
        description: '🛠 Base Setup (All 3 steps)'
        type: boolean
        default: false
      deploy_proxy:
        description: '🌐 Nginx Proxy'
        type: boolean
        default: false
      deploy_site:
        description: '🚀 Site (MySQL + Elgg)'
        type: boolean
        default: false
      deploy_tools:
        description: '🗄️ Tools (DBeaver + Portainer)'
        type: boolean
        default: false
      deploy_monitoring:
        description: '📊 Monitoring Stack'
        type: boolean
        default: false

defaults:
  run:
    working-directory: ansible

jobs:
  # ==============================================================================
  # 1. ФИЛЬТР ИЗМЕНЕНИЙ (Определяем, что конкретно поменялось)
  # ==============================================================================
  changes:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: . } }
    outputs:
      # Base
      base_setup: ${{ steps.filter.outputs.base_setup }}
      users: ${{ steps.filter.outputs.users }}
      docker: ${{ steps.filter.outputs.docker }}
      # Proxy
      proxy: ${{ steps.filter.outputs.proxy }}
      # Site
      mysql: ${{ steps.filter.outputs.mysql }}
      elgg: ${{ steps.filter.outputs.elgg }}
      # Tools
      dbeaver: ${{ steps.filter.outputs.dbeaver }}
      portainer: ${{ steps.filter.outputs.portainer }}
      # Monitoring
      prometheus: ${{ steps.filter.outputs.prometheus }}
      exporters: ${{ steps.filter.outputs.exporters }}
      alertmanager: ${{ steps.filter.outputs.alertmanager }}
      grafana: ${{ steps.filter.outputs.grafana }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            base_setup: 'ansible/playbooks/server-configurations/base-setup.yml'
            users: 'ansible/playbooks/server-configurations/user-management.yml'
            docker: ['ansible/playbooks/server-configurations/docker-setup.yml', 'ansible/roles/docker-setup/**']
            proxy: ['ansible/playbooks/services/deploy-reverse-proxy.yml', 'ansible/roles/deploy-reverse-proxy/**']
            mysql: ['ansible/playbooks/services/deploy-mysql.yml', 'ansible/roles/deploy-mysql/**']
            elgg: ['ansible/playbooks/services/deploy-elgg.yml', 'ansible/roles/deploy-elgg/**']
            dbeaver: 'ansible/playbooks/services/deploy-dbeaver.yml'
            portainer: ['ansible/playbooks/services/deploy-portainer*.yml', 'ansible/roles/portainer*/**']
            prometheus: ['ansible/playbooks/services/deploy-prometheus.yml', 'ansible/roles/deploy-prometheus/**']
            exporters: 'ansible/playbooks/services/deploy-exporters.yml'
            alertmanager: 'ansible/playbooks/services/deploy-alertmanager.yml'
            grafana: 'ansible/playbooks/services/deploy-grafana.yml'

  # ------------------------------------------------------------------
  # 2. ВАЛИДАЦИЯ (Lint & Syntax)
  # ------------------------------------------------------------------
  validate:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Secrets
        run: |
          echo "${{ secrets.VAULT_PASS }}" > .vault_pass.txt
          mkdir -p secrets inventory/group_vars/all
          echo "${{ secrets.VAULT_SECRETS }}"     > secrets/vault_secrets.yaml
          echo "${{ secrets.VAULT_USERS_DATA }}"  > secrets/vault_users.yaml
          echo "${{ secrets.DB_SECRETS }}"        > secrets/db_secrets.yaml
          echo "${{ secrets.VAULT_ALERT_SECRETS }}" > secrets/alert_secrets.yml
          ansible-vault encrypt secrets/*.yaml
          cp secrets/vault_secrets.yaml inventory/group_vars/all/vault_secrets.yaml

      - name: Syntax Check
        run: |
          for pb in $(find playbooks -name "*.yml"); do
            echo "🔎 Checking $pb"
            ansible-playbook "$pb" --syntax-check
          done

      - name: Test inventory
        run: |
          ansible all -m ping -vvv

      - name: Cleanup
        if: always()
        run: rm -f ansible/.vault_pass.txt

  # ==============================================================================
  # 3. БАЗОВАЯ НАСТРОЙКА (Строгая последовательность)
  # ==============================================================================
  
  # Шаг 3.1: Base OS
  base-os:
    needs: [validate, changes]
    runs-on: self-hosted
    if: ${{ inputs.deploy_base == true || (github.event_name == 'push' && needs.changes.outputs.base_setup == 'true') }}
    steps:
      - uses: actions/checkout@v4
      - name: Run Base Setup
        run: |
          echo "${{ secrets.VAULT_PASS }}" > .vault_pass.txt
          ansible-playbook playbooks/server-configurations/base-setup.yml
          rm .vault_pass.txt

  # Шаг 3.2: Users (Зависит от Base OS)
  base-users:
    needs: [base-os, changes] 
    if: ${{ always() && (inputs.deploy_base == true || (github.event_name == 'push' && needs.changes.outputs.users == 'true')) && needs.base-os.result != 'failure' }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Secrets & Run
        run: |
          echo "${{ secrets.VAULT_PASS }}" > .vault_pass.txt
          mkdir -p secrets inventory/group_vars/all
          echo "${{ secrets.VAULT_USERS_DATA }}" > secrets/vault_users.yaml
          ansible-vault encrypt secrets/vault_users.yaml
          ansible-playbook playbooks/server-configurations/user-management.yml
          rm .vault_pass.txt

  # Шаг 3.3: Docker (Зависит от Users)
  base-docker:
    needs: [base-users, changes]
    if: ${{ always() && (inputs.deploy_base == true || (github.event_name == 'push' && needs.changes.outputs.docker == 'true')) && needs.base-users.result != 'failure' }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Run Docker Setup
        run: |
          echo "${{ secrets.VAULT_PASS }}" > .vault_pass.txt
          ansible-playbook playbooks/server-configurations/docker-setup.yml
          rm .vault_pass.txt

  # ==============================================================================
  # 4. СЕРВИСЫ (Запускаются после Docker)
  # ==============================================================================

  # Proxy (Nginx)
  svc-proxy:
    needs: [base-docker, changes]
    if: ${{ always() && (inputs.deploy_proxy == true || (github.event_name == 'push' && needs.changes.outputs.proxy == 'true')) && needs.base-docker.result != 'failure' }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Proxy
        run: |
          echo "${{ secrets.VAULT_PASS }}" > .vault_pass.txt
          ansible-playbook playbooks/services/deploy-reverse-proxy.yml
          rm .vault_pass.txt

  # Database (MySQL)
  svc-mysql:
    needs: [base-docker, changes]
    if: ${{ always() && (inputs.deploy_site == true || (github.event_name == 'push' && needs.changes.outputs.mysql == 'true')) && needs.base-docker.result != 'failure' }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Deploy MySQL
        run: |
          echo "${{ secrets.VAULT_PASS }}" > .vault_pass.txt
          mkdir -p secrets inventory/group_vars/all
          echo "${{ secrets.DB_SECRETS }}" > secrets/db_secrets.yaml
          ansible-vault encrypt secrets/db_secrets.yaml
          ansible-playbook playbooks/services/deploy-mysql.yml
          rm .vault_pass.txt

  # App (Elgg) - Ждет MySQL и Proxy
  svc-elgg:
    needs: [svc-mysql, svc-proxy, changes]
    if: ${{ always() && (inputs.deploy_site == true || (github.event_name == 'push' && needs.changes.outputs.elgg == 'true')) && needs.svc-mysql.result != 'failure' }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Elgg
        run: |
          echo "${{ secrets.VAULT_PASS }}" > .vault_pass.txt
          mkdir -p secrets inventory/group_vars/all
          echo "${{ secrets.DB_SECRETS }}" > secrets/db_secrets.yaml
          ansible-vault encrypt secrets/db_secrets.yaml
          ansible-playbook playbooks/services/deploy-elgg.yml
          rm .vault_pass.txt

  # Tools: DBeaver
  tool-dbeaver:
    needs: [base-docker, changes]
    if: ${{ always() && (inputs.deploy_tools == true || (github.event_name == 'push' && needs.changes.outputs.dbeaver == 'true')) && needs.base-docker.result != 'failure' }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Deploy DBeaver
        run: |
          echo "${{ secrets.VAULT_PASS }}" > .vault_pass.txt
          ansible-playbook playbooks/services/deploy-dbeaver.yml
          rm .vault_pass.txt

  # Tools: Portainer
  tool-portainer:
    needs: [base-docker, changes]
    if: ${{ always() && (inputs.deploy_tools == true || (github.event_name == 'push' && needs.changes.outputs.portainer == 'true')) && needs.base-docker.result != 'failure' }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Portainer
        run: |
          echo "${{ secrets.VAULT_PASS }}" > .vault_pass.txt
          ansible-playbook playbooks/services/deploy-portainer-agent.yml
          ansible-playbook playbooks/services/deploy-portainer.yml
          rm .vault_pass.txt

  # ==============================================================================
  # 5. МОНИТОРИНГ
  # ==============================================================================

  mon-prometheus:
    needs: [base-docker, changes]
    if: ${{ always() && (inputs.deploy_monitoring == true || (github.event_name == 'push' && needs.changes.outputs.prometheus == 'true')) && needs.base-docker.result != 'failure' }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Prometheus
        run: |
          echo "${{ secrets.VAULT_PASS }}" > .vault_pass.txt
          ansible-playbook playbooks/services/deploy-prometheus.yml
          rm .vault_pass.txt

  mon-exporters:
    needs: [base-docker, changes] # Можно ставить параллельно с Прометеем
    if: ${{ always() && (inputs.deploy_monitoring == true || (github.event_name == 'push' && needs.changes.outputs.exporters == 'true')) && needs.base-docker.result != 'failure' }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Exporters
        run: |
          echo "${{ secrets.VAULT_PASS }}" > .vault_pass.txt
          ansible-playbook playbooks/services/deploy-exporters.yml
          rm .vault_pass.txt

  mon-alertmanager:
    needs: [mon-prometheus, changes] # Обычно нужен после Прометея
    if: ${{ always() && (inputs.deploy_monitoring == true || (github.event_name == 'push' && needs.changes.outputs.alertmanager == 'true')) && needs.mon-prometheus.result != 'failure' }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Alertmanager
        run: |
          echo "${{ secrets.VAULT_PASS }}" > .vault_pass.txt
          mkdir -p secrets inventory/group_vars/all
          echo "${{ secrets.VAULT_ALERT_SECRETS }}" > secrets/alert_secrets.yml
          ansible-vault encrypt secrets/alert_secrets.yml
          ansible-playbook playbooks/services/deploy-alertmanager.yml
          rm .vault_pass.txt

  mon-grafana:
    needs: [mon-prometheus, changes] # Запускаем только если Prometheus жив (опционально)
    if: ${{ always() && (inputs.deploy_monitoring == true || (github.event_name == 'push' && needs.changes.outputs.grafana == 'true')) && needs.mon-prometheus.result != 'failure' }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Grafana
        run: |
          echo "${{ secrets.VAULT_PASS }}" > .vault_pass.txt
          mkdir -p secrets inventory/group_vars/all
          echo "${{ secrets.VAULT_SECRETS }}" > secrets/vault_secrets.yaml
          ansible-vault encrypt secrets/vault_secrets.yaml
          ansible-playbook playbooks/services/deploy-grafana.yml
          rm .vault_pass.txt