name: Deploy infrastructure with Ansible

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg

jobs:

  delivery:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Prepare vault password file
        run: echo "${{ secrets.VAULT_PASS }}" > ansible/.vault_pass.txt

      - name: Create encrypted vault files
        run: |
          cd ansible
          mkdir -p secrets
          echo "${{ secrets.VAULT_SECRETS }}"     > secrets/vault_secrets.yaml
          echo "${{ secrets.VAULT_USERS_DATA }}"  > secrets/vault_users.yaml
          echo "${{ secrets.DB_SECRETS }}"        > secrets/db_secrets.yaml
          ansible-vault encrypt secrets/*.yaml

          mkdir -p inventory/group_vars/all
          echo "${{ secrets.VAULT_SECRETS }}"     > inventory/group_vars/all/vault_secrets.yaml
          ansible-vault encrypt inventory/group_vars/all/vault_secrets.yaml

      - run: rm -f ansible/.vault_pass.txt

      - name: Upload encrypted vault files
        uses: actions/upload-artifact@v4
        with:
          name: vaults
          path: | 
            ansible/secrets/*.yaml
            ansible/inventory/group_vars/
        


  validate:
    runs-on: self-hosted
    needs: delivery

    steps:
      - uses: actions/checkout@v4

      - name: Download vault files
        uses: actions/download-artifact@v4
        with:
          name: vaults
          path: | 
            ansible/secrets/*.yaml
            ansible/inventory/group_vars/

      - name: Prepare vault password file
        run: echo "${{ secrets.VAULT_PASS }}" > ansible/.vault_pass.txt

      # -------------------------
      # HUMAN-FRIENDLY PROJECT OVERVIEW
      # -------------------------
      - name: List playbooks (summary for newcomers)
        run: |
          echo "## 📚 Available Playbooks" >> $GITHUB_STEP_SUMMARY
          find ansible/playbooks -name "*.yml" -maxdepth 3 >> $GITHUB_STEP_SUMMARY

      - name: Show tasks inside each playbook
        run: |
          echo "## 📝 Tasks inside Playbooks" >> $GITHUB_STEP_SUMMARY
          for pb in $(find ansible/playbooks -name "*.yml"); do
            echo "### ▶ $pb" >> $GITHUB_STEP_SUMMARY
            ansible-playbook $pb --list-tasks >> $GITHUB_STEP_SUMMARY 2>/dev/null
            echo "" >> $GITHUB_STEP_SUMMARY
          done

      # -------------------------
      # QUALITY CHECKS
      # -------------------------
      - name: Run ansible-lint
        run: |
          cd ansible
          ansible-lint .

      - name: Syntax-check only playbooks
        run: |
          cd ansible
          for pb in $(find playbooks -name "*.yml"); do
            echo "🔎 Syntax check: $pb"
            ansible-playbook "$pb" --syntax-check
          done

      - name: Ping hosts
        run: |
          cd ansible
          ansible all -m ping -vvv

      - run: rm -f ansible/.vault_pass.txt


  deploy:
    runs-on: self-hosted
    needs: validate

    steps:
      - uses: actions/checkout@v4

      - name: Download vault files
        uses: actions/download-artifact@v4
        with:
          name: vaults
          path: | 
            ansible/secrets/*.yaml
            ansible/inventory/group_vars/

      - name: Prepare vault password file
        run: echo "${{ secrets.VAULT_PASS }}" > ansible/.vault_pass.txt

      - name: Run deployment playbooks
        run: |
          cd ansible
          for pb in \
            playbooks/server-configurations/base-setup.yml \
            playbooks/server-configurations/user-management.yml \
            playbooks/server-configurations/docker-setup.yml \
            playbooks/services/deploy-mysql.yml \
            playbooks/services/deploy-elgg.yml;
          do
            ansible-playbook "$pb"
          done

      - run: rm -f ansible/.vault_pass.txt
