name: Deploy infrastructure with Ansible

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:

  delivery:
    runs-on: self-hosted
    env:
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg

    steps:
      - uses: actions/checkout@v4

      - name: Prepare vault password file
        run: echo "${{ secrets.VAULT_PASS }}" > ansible/.vault_pass.txt

      - name: Create vault files
        run: |
          cd ansible
          mkdir -p secrets
          echo "${{ secrets.VAULT_SECRETS }}" > secrets/vault_secrets.yaml
          echo "${{ secrets.VAULT_USERS_DATA }}" > secrets/vault_users.yaml
          echo "${{ secrets.DB_SECRETS }}" > secrets/db_secrets.yaml
          ansible-vault encrypt secrets/*.yaml

      - run: rm -f ansible/.vault_pass.txt


  validate:
    runs-on: self-hosted
    needs: delivery
    env:
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg

    steps:
      - uses: actions/checkout@v4

      - name: Prepare vault pass
        run: echo "${{ secrets.VAULT_PASS }}" > ansible/.vault_pass.txt

      - name: Test inventory
        run: |
          cd ansible
          ansible all -m ping -vvv
          ansible-playbook playbooks/ping-host.yml

      - run: rm -f ansible/.vault_pass.txt


  deploy:
    runs-on: self-hosted
    needs: validate
    env:
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg

    steps:
      - uses: actions/checkout@v4

      - name: Prepare vault pass
        run: echo "${{ secrets.VAULT_PASS }}" > ansible/.vault_pass.txt

      - name: Run playbooks
        run: |
          cd ansible
          ansible-playbook playbooks/server-configurations/base-setup.yml
          ansible-playbook playbooks/server-configurations/user-management.yml
          ansible-playbook playbooks/server-configurations/docker-setup.yml
          ansible-playbook playbooks/services/deploy-mysql.yml
          ansible-playbook playbooks/services/deploy-elgg.yml

      - run: rm -f ansible/.vault_pass.txt
