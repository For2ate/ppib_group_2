---
# Основные настройки
team_id: "2"
prometheus_image: "prom/prometheus:latest"
prometheus_container_name: "prometheus.team{{ team_id }}.lab"
prometheus_restart_policy: "unless-stopped"

# Сеть
monitoring_network: "monitoring-net"

# Пути
prometheus_project_dir: "{{ base_services_dir }}/prometheus"
prometheus_data_dir: "{{ prometheus_project_dir }}/data"

# Alertmanager (куда слать алерты)
alertmanager_host: "alertmanager.team{{ team_id }}.lab:9093"

# --- Таргеты для сбора метрик ---
# Мы выносим IP и порты в список, чтобы не править шаблон каждый раз
prometheus_scrape_configs:
  - job_name: 'node_exporter_srv1'
    target: '10.31.52.101:9100'
  - job_name: 'cadvisor_srv1'
    target: '10.31.52.101:9101'
  - job_name: 'node_exporter_srv2'
    target: '10.31.52.108:9100'
  - job_name: 'cadvisor_srv2'
    target: '10.31.52.108:9101'