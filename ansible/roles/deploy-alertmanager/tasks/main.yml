---
- name: Ensure Monitoring network exists
  community.docker.docker_network:
    name: "{{ monitoring_network }}"
    state: present

- name: Create Alertmanager project directory
  file:
    path: "{{ alertmanager_project_dir }}"
    state: directory
    mode: '0755'

- name: Create Alertmanager data directory (permissions for nobody)
  file:
    path: "{{ alertmanager_data_dir }}"
    state: directory
    mode: '0777'

- name: Copy configuration file
  template:
    src: alertmanager.yaml.j2
    dest: "{{ alertmanager_project_dir }}/alertmanager.yaml"
    mode: '0644'

- name: Copy docker-compose template
  template:
    src: docker-compose.yml.j2
    dest: "{{ alertmanager_project_dir }}/docker-compose.yml"
    mode: '0644'

- name: Deploy Alertmanager
  community.docker.docker_compose_v2:
    project_src: "{{ alertmanager_project_dir }}"
    state: present
    pull: always
