
# ------------------------------- 
# Убедиться, что MySQL запущен
# -------------------------------
- name: Wait for MySQL to be ready
  community.mysql.mysql_info:
    login_user: root
    login_password: "{{ db_root_password }}"
    login_host: 127.0.0.1
    login_port: "{{ db_port }}"
  register: mysql_status
  retries: 10
  delay: 5
  until: mysql_status is succeeded
  become: false

# -------------------------------
# Получаем CIDR докер-сети
# -------------------------------
- name: Get Docker network info
  community.docker.docker_network_info:
    name: "{{ db_network }}"
  register: docker_net

- name: Extract Docker subnet
  set_fact:
    docker_subnet: "{{ docker_net.network.IPAM.Config[0].Subnet }}"

# -------------------------------
# Создаём MySQL-пользователя для всей Docker-сети
# -------------------------------

- name: Ensure cms_user can connect only from allowed hosts
  community.mysql.mysql_user:
    name: "{{ db_user }}"
    host: "{{ item }}"
    plugin: caching_sha2_password
    plugin_auth_string: "{{ db_user_password }}"
    priv: "{{ db_name }}.*:ALL"
    state: present
    login_user: root
    login_password: "{{ db_root_password }}"
    login_host: 127.0.0.1
    login_port: "{{ db_port }}"
  loop: "{{ (groups['db-hosts'] | map('extract', hostvars, 'ansible_host') | list) + [ docker_subnet ] }}"
  become: false

- name: Ensure read-only user exists and can connect only from allowed hosts
  community.mysql.mysql_user:
    name: "{{ db_reader_user }}"
    host: "{{ item }}"
    plugin: caching_sha2_password
    plugin_auth_string: "{{ db_reader_password }}"
    priv: "{{ db_name }}.*:SELECT"
    state: present
    login_user: root
    login_password: "{{ db_root_password }}"
    login_host: 127.0.0.1
    login_port: "{{ db_port }}"
  loop: "{{ (groups['db-hosts'] | map('extract', hostvars, 'ansible_host') | list) + [ docker_subnet ] }}"
  become: false