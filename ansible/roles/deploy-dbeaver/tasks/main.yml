---
- name: Ensure Docker network exists
  community.docker.docker_network:
    name: "{{ dbeaver_network }}"
    state: present

- name: Create DBeaver directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
    owner: "1000" 
    group: "1000"
  loop:
    - "{{ dbeaver_project_dir }}"
    - "{{ dbeaver_data_dir }}"

- name: Copy docker-compose template
  template:
    src: docker-compose.yml.j2
    dest: "{{ dbeaver_project_dir }}/docker-compose.yml"
    mode: '0644'

- name: Deploy DBeaver stack
  community.docker.docker_compose_v2:
    project_src: "{{ dbeaver_project_dir }}"
    state: present
    pull: always