---
- name: Ensure Monitoring network exists
  community.docker.docker_network:
    name: "{{ grafana_network }}"
    state: present

- name: Create Grafana project directory
  file:
    path: "{{ grafana_project_dir }}"
    state: directory
    mode: '0755'

# ВАЖНО: Grafana запускается с UID 472. 
# Чтобы не было проблем с правами, даем полный доступ на папку данных
- name: Create Grafana data directory with permissions
  file:
    path: "{{ grafana_data_dir }}"
    state: directory
    mode: '0777'
    # owner: "472" # Альтернативный вариант, но 777 проще

- name: Copy docker-compose template
  template:
    src: docker-compose.yml.j2
    dest: "{{ grafana_project_dir }}/docker-compose.yml"
    mode: '0644'

- name: Deploy Grafana stack
  community.docker.docker_compose_v2:
    project_src: "{{ grafana_project_dir }}"
    state: present
    pull: always