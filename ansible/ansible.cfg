[defaults]
inventory                   = ./inventory/hosts.ini
roles_path                  = ./roles
vault_password_file         = .vault_pass.txt
host_key_checking           = True
remote_user                 = ansible
interpreter_python          = /usr/bin/python3

[ssh_connection]
ssh_args = -F /home/ivan/.ssh/ssh_config -o PreferredAuthentications=password -o PubkeyAuthentication=no